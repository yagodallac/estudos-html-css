<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário</title>
</head>
<body>
    <h1>Exemplo de formulário</h1>

    <form action="cadastro.php" method="post">
        <fieldset>
            <legend>Esportes</legend>
                <p>
                    <input type="checkbox" name="fut" id="fut" value="futebol">
                    <label for="fut">Futebol</label> <br>
                    <input type="checkbox" name="basq" id="basq" value="basquete">
                    <label for="basq">Basquete</label> <br>
                    <input type="checkbox" name="vole" id="vole" value="voleibol">
                    <label for="vole">Voleibol</label> <br>
                    <input type="checkbox" name="f1" id="f1" value="futebol">
                    <label for="f1">Fórmula 1</label> <br>
                </p>
        </fieldset>
        <fieldset>
            <legend>Sexo</legend>
            <p>
                <input type="radio" name="sexo" id="masc" value="masculino" checked>
                <label for="masc">Masculino</label> <br>
                <input type="radio" name="sexo" id="fem" value="feminino">
                <label for="fem">Feminino</label> <br>

            </p>
        </fieldset>
        <fieldset>
            <legend>Foto/cor favorita</legend>
            <p>
                <label for="foto">Foto:</label>
                <input type="file" name="foto" id="foto">
            </p>
            <p>
                <label for="cor">Cor:</label>
                <input type="color" name="cor" id="cor">
            </p>
            <p>
                <label for="nivel">Nível de Preferência:</label>
                <input type="range" name="nivel" id="nivel" min="0" max="100">
            </p>
        </fieldset>
            <p>
                <input type="submit" value="Enviar">
                <input type="reset" value="Limpar">
            </p>
    </form>

</body>
</html>
