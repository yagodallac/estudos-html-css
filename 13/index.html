<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabelas</title>
    <style>
        table {
            width: 300px;
            border-collapse: collapse;
        }
        th, td {
            border: 1px solid black;
            padding: 5px;
            text-align: left;
        }
    </style>

</head>
<body>
    <h1>Minha primeira tabela!</h1>
    <table>
        <tr>
            <th>Nome</th>
            <th>Idade</th>
            <th>Cidade</th>
        </tr>
        <tr>
            <td>Yago</td>
            <td>23</td>
            <td>Camboriú</td>
        </tr>
        <tr>
            <td>Maria</td>
            <td>22</td>
            <td>Balneario Camború</td>
        </tr>
        <tr>
            <td>Yan</td>
            <td>27</td>
            <td>Itajaí</td>
        </tr>
        <tr>
            <td>Simone</td>
            <td>55</td>
            <td>Camboriú</td>
        </tr>
    </table>
</body>
</html>
