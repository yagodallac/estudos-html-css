<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabela de notas escolares</title>
</head>
<style>
    table {
        border-collapse: collapse;
        width: 70%;
    }
    caption {
        font-size: 1.5em;
        margin: 0.5em 0;
    }
    th, td {
        border: 1px solid #000;
        padding: 8px;
        text-align: left;
    }

    th {
        background-color: #999999;
        color: white;
    }

    th.notas {
        background-color: #008b23;
        color: white;
    }

    td.notas {
        background-color: #008b2354;
        color: rgb(0, 0, 0);
        font-weight: bold;
    }
</style>
<body>
    <table>
        <caption>Tabela de Notas Escolares</caption>
            <thead>
                <tr>
                    <th rowspan="2">Área</th>
                    <th rowspan="2">Disciplina</th>
                    <th colspan="2">Notas</th>
                    <th rowspan="2">Média</th>
                </tr>
                <tr>
                    <th>Nota 1</th>
                    <th>Nota 2</th>
                </tr>
                
            </thead>
            <tbody>
                <tr>
                    <th rowspan="4">Exatas</th>
                    <td>Matemática</td>
                    <td>8.5</td>
                    <td>7.0</td>
                    <td>7.75</td>
                </tr>   
                <tr>
                    <td>Física</td>
                    <td>9.0</td>
                    <td>8.5</td>
                    <td>8.75</td>
                </tr>
                <tr>
                    <td>Química</td>
                    <td>8.0</td>
                    <td>7.5</td>
                    <td>7.75</td>
                </tr>
                <tr>
                    <td>Biologia</td>
                    <td>9.5</td>
                    <td>8.0</td>
                    <td>8.75</td>
                </tr>
                <tr>
                    <th colspan="4" class="notas">Média de Exatas</th>
                    <td class="notas">9.0</td>
                </tr>
                    <th rowspan="2">Humanas</th>
                    <td>História</td>
                    <td>8.0</td>
                    <td>7.5</td>
                    <td>7.75</td>
                </tr>
                <tr>
                    <td>Geografia</td>
                    <td>8.5</td>
                    <td>8.0</td>
                    <td>8.25</td>
                </tr>
                <tr>
                    <th colspan="4" class="notas">Média de Humanas</th>
                    <td class="notas">7.75</td>
                </tr>
            </tbody>
    </table>
</body>
</html>
